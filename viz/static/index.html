<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jeu de la Vie 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #151c25;
        --line: #2d3a48;
        --text: #e6edf3;
        --muted: #8b9aaa;
        --accent: #62d6c4;
        --alive: #ffcc66;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 0%, #1b2935 0, var(--bg) 45%);
        color: var(--text);
        font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      main { width: min(1180px, 100%); margin: auto; padding: 28px; }
      header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 20px; }
      h1 { margin: 0; font: 700 clamp(28px, 5vw, 54px)/1.05 Georgia, serif; letter-spacing: .01em; }
      .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
      .status { color: var(--muted); text-align: right; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; }
      .stage, .controls { border: 1px solid var(--line); background: rgba(21, 28, 37, .86); }
      .stage { min-height: 600px; position: relative; overflow: hidden; }
      canvas { display: block; width: 100%; height: 600px; }
      .legend { position: absolute; left: 18px; bottom: 16px; color: var(--muted); }
      .dot { display: inline-block; width: 9px; height: 9px; margin-right: 7px; background: var(--alive); border-radius: 50%; }
      .controls { padding: 20px; }
      label { display: block; color: var(--muted); font-size: 13px; margin: 0 0 8px; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .value { color: var(--text); font-weight: 700; }
      button { width: 100%; padding: 11px 14px; margin-top: 12px; border: 1px solid var(--accent); background: transparent; color: var(--text); cursor: pointer; font: inherit; }
      button:hover, button.active { background: var(--accent); color: #0d1117; }
      .noise { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 16px; }
      .noise label { display: flex; align-items: center; gap: 8px; }
      .noise label[for="noiseToggle"] { color: var(--text); font-size: 14px; margin-bottom: 14px; cursor: pointer; }
      .noise label[for="noiseRate"] { display: block; }
      .noise input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); }
      .stats { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 16px; color: var(--muted); }
      .stats strong { color: var(--text); }
      @media (max-width: 760px) {
        main { padding: 18px; }
        header { display: block; }
        .status { margin-top: 10px; text-align: left; }
        .layout { grid-template-columns: 1fr; }
        .stage, canvas { min-height: 430px; height: 430px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><div class="eyebrow">Simulation en temps réel</div><h1>Jeu de la Vie 3D</h1></div>
        <div id="status" class="status">Connexion au moteur...</div>
      </header>
      <section class="layout">
        <div class="stage">
          <canvas id="scene" aria-label="Rendu 3D de la simulation"></canvas>
          <div class="legend"><span class="dot"></span>cellules vivantes</div>
        </div>
        <aside class="controls">
          <button id="step">Avancer d’une génération</button>
          <button id="play">Lancer la simulation</button>
          <button id="reset">Réinitialiser la grille</button>
          <div class="noise">
            <label for="noiseToggle">
              <input type="checkbox" id="noiseToggle" checked />
              Impacts météores aléatoires
            </label>
            <label for="noiseRate">Fréquence des impacts : <span class="value" id="noiseRateValue">12 %</span> par étape</label>
            <input type="range" id="noiseRate" min="0" max="0.6" step="0.01" value="0.12" />
          </div>
          <div class="stats">
            <div>Dimension : <strong id="ndim">-</strong></div>
            <div>Grille : <strong id="shape">-</strong></div>
            <div>Cellules vivantes : <strong id="count">-</strong></div>
            <div>Génération : <strong id="generation">0</strong></div>
          </div>
        </aside>
      </section>
    </main>
    <script>
      const canvas = document.querySelector('#scene');
      const context = canvas.getContext('2d');
      const sliceInput = document.querySelector('#slice');
      const sliceValue = document.querySelector('#sliceValue');
      const status = document.querySelector('#status');
      const generation = document.querySelector('#generation');
      const noiseToggle = document.querySelector('#noiseToggle');
      const noiseRate = document.querySelector('#noiseRate');
      const noiseRateValue = document.querySelector('#noiseRateValue');
      let state = null;
      let timer = null;

      function resizeCanvas() {
        const scale = window.devicePixelRatio || 1;
        const bounds = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(bounds.width * scale));
        canvas.height = Math.max(1, Math.floor(bounds.height * scale));
        context.setTransform(scale, 0, 0, scale, 0, 0);
        draw();
      }

      function project(x, y, z, size, width, height) {
        const gap = size * 0.72;
        return { x: width / 2 + (x - y) * gap, y: height / 2 + (x + y) * gap * 0.5 - z * gap * 0.8 };
      }

      function draw() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        context.clearRect(0, 0, width, height);
        if (!state) return;
        const shape = state.shape;
        const cells = state.live_cells;
        const maxSide = Math.max(...shape.slice(0, 3));
        const size = Math.max(4, Math.min(width, height) / (maxSide * 1.7));
        context.fillStyle = 'rgba(98, 214, 196, .08)';
        for (let x = 0; x < shape[0]; x++) for (let y = 0; y < shape[1]; y++) for (let z = 0; z < shape[2]; z++) {
          const point = project(x, y, z, size, width, height);
          context.fillRect(point.x - 1, point.y - 1, 2, 2);
        }
        context.fillStyle = '#ffcc66';
        cells.forEach(([x, y, z]) => {
          const point = project(x, y, z, size, width, height);
          context.beginPath();
          context.arc(point.x, point.y, Math.max(2.5, size * .34), 0, Math.PI * 2);
          context.fill();
        });
      }

      async function loadState() {
        const response = await fetch('/state');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state = await response.json();
        document.querySelector('#ndim').textContent = `${state.ndim}D`;
        document.querySelector('#shape').textContent = state.shape.join(' × ');
        document.querySelector('#count').textContent = state.live_cells.length;
        status.textContent = state.ndim === 3 ? 'Grille 3D active' : 'Le serveur doit être configuré en 3D';
        draw();
      }

      async function step() {
        await fetch('/step', { method: 'POST' });
        generation.textContent = Number(generation.textContent) + 1;
        await loadState();
      }

      function formatRate(rate) {
        return `${(rate * 100).toFixed(0)} %`;
      }

      async function pushNoise() {
        const params = new URLSearchParams({
          enabled: noiseToggle.checked,
          rate: noiseRate.value,
        });
        await fetch(`/noise?${params}`, { method: 'POST' });
      }

      async function loadNoise() {
        const response = await fetch('/noise');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const noise = await response.json();
        noiseToggle.checked = noise.enabled;
        noiseRate.value = noise.rate;
        noiseRateValue.textContent = formatRate(noise.rate);
      }

      document.querySelector('#step').addEventListener('click', () => step().catch(showError));
      document.querySelector('#reset').addEventListener('click', async () => {
        await fetch('/reset', { method: 'POST' });
        generation.textContent = '0';
        await loadState();
      });
      document.querySelector('#play').addEventListener('click', (event) => {
        if (timer) { clearInterval(timer); timer = null; event.target.textContent = 'Lancer la simulation'; event.target.classList.remove('active'); return; }
        timer = setInterval(() => step().catch(showError), 700);
        event.target.textContent = 'Mettre en pause'; event.target.classList.add('active');
      });
      noiseToggle.addEventListener('change', () => pushNoise().catch(showError));
      noiseRate.addEventListener('input', () => {
        noiseRateValue.textContent = formatRate(Number(noiseRate.value));
      });
      noiseRate.addEventListener('change', () => pushNoise().catch(showError));
      function showError(error) { status.textContent = `Erreur : ${error.message}`; }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      loadState().catch(showError);
      loadNoise().catch(showError);
    </script>
  </body>
</html>
